      function initMap() {

        map = new google.maps.Map(document.getElementById('map'), {
          zoom: 13,
          center: {lat: 35.643822, lng: 140.068231},
          mapTypeId: 'satellite'
        });

// 航空写真のオーバーレイ化
        for (var i = 0; i < overlays.length; i++) {
          overlays[i].overlay = new google.maps.GroundOverlay(
            overlays[i].srcImage, 
            overlays[i].bounds, 
            { opacity: 1.0,
              clickable: false 
          });
          overlays[i].overlay.setMap(map);
        }

// 写真のオーバーレイ化
        for (var i = 0; i < photos.length; i++) {
          photos[i].overlay = new GMOverlayHtml({
            position: photos[i].position,
            $content: create$content({
              text: photos[i].text,
              src: photos[i].src,
              topOrBottom: photos[i].topOrBottom,
              left: photos[i].left,
              skewX: photos[i].skewX,
              url: photos[i].url
            })
          });
          photos[i].overlay.setMap(map);
        }

        $("#opacity").change(function() { redraw(); });

      }

      var create$content = function (opts) {

        var balloonColor = "cornsilk";

        var defaults = {
          topOrBottom: "bottom",
          left: "-10px",
          skewX: "0deg",
          text: "新宿",
          src: "https://live.staticflickr.com/968/40266504040_e38a3b5f39_t.jpg",
          url: "miyakogawa.html"
        };

        $.extend( true, this, defaults, opts );

        if ( topOrBottom === "top" ) {

          var $content = 
            $("<div></div>").append(
              $("<div></div>").css({
                position: "absolute",
                bottom: "-50px",
                left: "-10px",
                width: "0",
                height: "0",
                borderLeft: "10px solid transparent",
                borderRight: "10px solid transparent",
                borderTop: "50px solid " + balloonColor,
                borderBottom: "50px solid transparent",
                transform: "skewX(" + this.skewX + ")"
              })).append(
              $("<div></div>").css({
                  bottom: "50px",
                  left: this.left,
                  position: "absolute",
                  padding: "5px",
                  background: balloonColor,
                  borderRadius: "2px",
              }).append(
                $("<p></p>", { 
                  text: this.text 
                }).css({
                  padding: "0px",
                  margin: "0px"
                })
              ).append(
                $("<img>", {
                  src: this.src
                }).css({
				width: "200px",
                height: "auto",})
              ).simplyModal({
                  url: this.url,
                  modalClass: "modal"
              }).css({cursor: "pointer"})
            );

        } else {
          var $content = 
            $("<div></div>").append(
              $("<div></div>").css({
                content: "",
                position: "absolute",
                top: "-50px",
                left: "-10px",
                width: "0",
                height: "0",
                borderLeft: "10px solid transparent",
                borderRight: "10px solid transparent",
                borderTop: "50px solid transparent",
                borderBottom: "50px solid " + balloonColor,
                transform: "skewX(" + this.skewX + ")"
              })).append(
              $("<div></div>").css({
                  display: "inline-block",
                  top: "50px",
                  left: this.left,
                  position: "absolute",
                  padding: "5px",
                  background: balloonColor,
                  borderRadius: "2px",
              }).append(
                $("<p></p>", { 
                  text: this.text 
                }).css({
                  padding: "0px",
                  margin: "0px"
                })
              ).append(
                $("<img>", {
                  src: this.src
                }).css({
				width: "200px",
                height: "auto",})
              ).simplyModal({
                  url: this.url,
                  modalClass: "modal"
              }).css({cursor: "pointer"})
            );
        }

        return $content;

      }

      var toggle = function() {
      
        for (var i = 0; i < overlays.length; i++) {
          if (overlays[i].overlay.getMap()) {
            overlays[i].overlay.setMap(null);
          } else {
            overlays[i].overlay.setMap(map);
          }
        }

      };

      var togglePhotos = function() {
      
        for (var i = 0; i < photos.length; i++) {
          if (photos[i].overlay.getMap()) {
            photos[i].overlay.setMap(null);
          } else {
            photos[i].overlay.setMap(map);
          }
        }

      };

      var redraw = function() {

        for (var i = 0; i < overlays.length; i++) {
          overlays[i].overlay.setMap(null);
          opacity = Number($("#opacity").val())/100;
          overlays[i].overlay = new google.maps.GroundOverlay(
            overlays[i].srcImage, 
            overlays[i].bounds, 
            { opacity: opacity 
            });
          overlays[i].overlay.setMap(map);
        }

      };

      var toggleDoc = function() {

        if ($("#doc span").is(':visible')) {
            $("#doc span").hide();
        } else {
            $("#doc span").show();
        }

      };


      google.maps.event.addDomListener(window, 'load', initMap);

    </script>
