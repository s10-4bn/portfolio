<!DOCTYPE html>
<html lang="ja">
<head> 
<meta charset=UTF-8">
<link rel="shortcut icon" type="image/x-icon" href="https://s10-4bn.sunnyday.jp/family/images/favicon.ico">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族の写真</title>
<link rel="stylesheet" type="text/css" href="../_css/reset.css">
<link rel="stylesheet" type="text/css" href="css/local.css">

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCb8PavWo2x5mnndiskqEET4tb5iUkkpIc&libraries=geometry" type="text/javascript" ></script> 
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.0/jquery.min.js" type="text/javascript" ></script>
<script src='js/local.js' type='text/javascript' ></script>
<script src="../_js/imagesLoader.js" type='text/javascript'></script>
<script src="../_js/jQuery.showImgSequence.js"></script>
<script src='../_js/localPhotoset.js' type='text/javascript' ></script>
<script src="../_js/GM.lib.js"></script> 
<script src="../_js/loading.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exif-js"></script>



</head>

<body>

	<div id="initialize" >
		<input type="file"
		       id="localPhotoFolder"
		       webkitdirectory
		       directory
		       multiple
		       accept=".jpg,.jpeg,image/jpeg"
		       style="display:none;">
		
		<button id="selectLocalPhotoFolder">"家族の写真"フォルダを選択</button>
	</div>

	<div id="collections" >
	
		<div id="title">家族の写真</div>
	
	    <div id="search-wrapper">
	        <form method="get" action="" onsubmit="List_search(); return false">
	            <p>
	                <input id="search" type="search" name="q" size="30" placeholder="検索テキスト" required> 
	                <input type="submit" value="家族の写真を検索">
	            </p>
	        </form>
	    </div>
	
	    <div id="collection_list-wrapper">
		    <div id="collection_list"></div>
	    </div>
	    <div style="clear: both"></div>
	
		<hr/>
	    <div id="list-wrapper">
		    <div id="list"></div>
	    </div>
		<hr/>

	</div>

	<div id="photoset" >

    	<div id="back-wrapper">
			<div id="back" class="button" >戻る</div>
		</div>


	    <div id="photo-container">
	        <div id="btn-top">Top</div>
	        <div id="contents">
	            <div id="photo-header">
	                <div id="setInfo"></div>
	                <hr>
	                <div id="photo-to-map-wrapper">
	                    <div id="photo-to-map" class="button" >地図</div>
	                </div>
	                <div id="slideshow-wrapper">
	                    <div id="slideshow-button" class="button" ></div>
	                </div>
	            </div>
	
	            <div id="photoCanvas">
	                <ul id="photos"></ul>
	                <hr/>
	            </div> 
	        </div>
	    </div>
	
	    <div id="map-container">
	        <div id="map-canvas"></div>
	        <div id="map-header">
	            <div id="map-title">loading...</div>
	            <div id="map-to-photo-wrapper">
	                <div id="map-to-photo" class="button">写真</div>
	            </div>
	        </div>
	    </div>
	
	    <div id="slide-container">
	        <ul id="slide"></ul>
	    </div>
	
	    <div id="slideshow"></div>




	</div>

	
</body>
                    
</html>
